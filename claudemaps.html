<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClaudeMaps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff;--tx:#202124;--mute:#5f6368;--line:#dadce0;--blue:#1a73e8;--chip:#e8f0fe;--sh:0 2px 8px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root{--bg:#27292d;--tx:#e8eaed;--mute:#9aa0a6;--line:#44474b;--blue:#8ab4f8;--chip:#394457;--sh:0 2px 8px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);overflow:hidden}
#map{position:fixed;inset:0}
.search{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1000;max-width:520px;margin:0 auto}
.bar{display:flex;align-items:center;background:var(--bg);border-radius:28px;box-shadow:var(--sh);padding:0 6px 0 16px;height:50px}
.bar b{color:var(--blue);font-size:15px;margin-right:10px;white-space:nowrap}
.bar input{flex:1;border:0;outline:0;background:none;color:var(--tx);font:inherit;font-size:16px;min-width:0}
.bar button{border:0;background:none;color:var(--mute);font-size:20px;width:40px;height:40px;cursor:pointer;border-radius:50%}
#res{background:var(--bg);border-radius:14px;box-shadow:var(--sh);margin-top:8px;overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--tx);padding:12px 16px;font:inherit;font-size:14px;cursor:pointer}
#res button small{display:block;color:var(--mute);margin-top:2px}
.fabs{position:fixed;right:12px;z-index:1000;display:flex;flex-direction:column;gap:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));transition:bottom .2s}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);color:var(--tx);box-shadow:var(--sh);font-size:21px;cursor:pointer}
.fab.on{color:var(--blue)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;max-width:560px;margin:0 auto;max-height:55vh;overflow-y:auto}
.sheet h2{font-size:19px;font-weight:600}
.sheet p{color:var(--mute);font-size:14px;margin-top:4px;line-height:1.4}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--blue);border-radius:20px;padding:9px 18px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#202124}}
.btn[aria-pressed="true"]{background:var(--chip);border-color:var(--blue)}
#sum{font-size:20px;margin-top:12px}
#sum span{color:var(--mute);font-size:15px}
#steps{margin-top:8px;font-size:14px;list-style:none;padding:0}
#steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
#steps li i{color:var(--mute);font-style:normal;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#323232;color:#fff;border-radius:8px;padding:9px 14px;font-size:14px;z-index:2000;display:none;max-width:90%}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>

<div class="search">
  <div class="bar"><b>ClaudeMaps</b><input id="q" type="search" placeholder="Cari tempat atau alamat" aria-label="Cari tempat" autocomplete="off"><button id="go" aria-label="Cari">⌕</button></div>
  <div id="res"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="lay" aria-label="Ganti tampilan peta">◫</button>
  <button class="fab" id="loc" aria-label="Lokasi saya">◎</button>
</div>

<div class="sheet" id="sheet">
  <h2 id="t"></h2><p id="a"></p>
  <div class="acts" id="acts"><button class="btn p" id="rt">Rute</button><button class="btn" id="x">Tutup</button></div>
  <div id="rpanel" style="display:none">
    <div class="acts" id="modes">
      <button class="btn" data-m="car" aria-pressed="true">Mobil</button>
      <button class="btn" data-m="bike" aria-pressed="false">Sepeda</button>
      <button class="btn" data-m="foot" aria-pressed="false">Jalan kaki</button>
    </div>
    <div id="sum"></div><ul id="steps"></ul>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-6.2088,106.8456],12);
  var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, Maxar'});
  var cur=osm.addTo(map);
  var me=null,meMark=null,meCirc=null,pin=null,dest=null,line=null,lineBg=null,mode='car',first=true,watching=false;

  function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},3200)}

  $('lay').onclick=function(){map.removeLayer(cur);cur=cur===osm?sat:osm;cur.addTo(map);this.classList.toggle('on',cur===sat)};

  /* Lokasi GPS akurasi tinggi */
  function locate(){
    if(!navigator.geolocation){toast('Perangkat tidak mendukung lokasi');return}
    if(me&&!first){map.flyTo(me,Math.max(map.getZoom(),17));return}
    if(watching)return;
    watching=true;toast('Mencari sinyal GPS…');
    navigator.geolocation.watchPosition(function(p){
      var c=p.coords;me=[c.latitude,c.longitude];
      if(!meMark){
        meCirc=L.circle(me,{radius:c.accuracy,color:'#1a73e8',weight:1,fillOpacity:.14}).addTo(map);
        meMark=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:900}).addTo(map);
      }else{meMark.setLatLng(me);meCirc.setLatLng(me);meCirc.setRadius(c.accuracy)}
      if(first){first=false;map.flyTo(me,c.accuracy<80?17:15);$('loc').classList.add('on');toast('Akurasi lokasi ±'+Math.round(c.accuracy)+' m')}
    },function(e){
      watching=false;
      toast(e.code===1?'Izin lokasi ditolak. Aktifkan di pengaturan browser.':'Lokasi belum tersedia. Coba di tempat terbuka.');
    },{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  }
  $('loc').onclick=locate;

  /* Pencarian */
  var res=$('res');
  function search(){
    var s=$('q').value.trim();if(!s)return;
    var u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=id&q='+encodeURIComponent(s);
    if(me)u+='&viewbox='+(me[1]-1)+','+(me[0]+1)+','+(me[1]+1)+','+(me[0]-1);
    fetch(u).then(function(r){return r.json()}).then(function(a){
      res.innerHTML='';res.style.display='block';
      if(!a.length){res.innerHTML='<button>Tidak ada hasil. Coba kata kunci lain.</button>';return}
      a.forEach(function(p){
        var b=document.createElement('button');
        var parts=p.display_name.split(', ');
        b.textContent=parts[0];var sm=document.createElement('small');sm.textContent=parts.slice(1,5).join(', ');b.appendChild(sm);
        b.onclick=function(){res.style.display='none';pick(+p.lat,+p.lon,parts[0],p.display_name)};
        res.appendChild(b);
      });
    }).catch(function(){toast('Pencarian gagal. Periksa koneksi internet.')});
  }
  $('go').onclick=search;
  $('q').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();search()}};

  function pick(lat,lon,name,addr){
    dest=[lat,lon];clearRoute();
    if(pin)pin.remove();pin=L.marker(dest).addTo(map);
    $('t').textContent=name;$('a').textContent=addr||'';
    $('rpanel').style.display='none';$('acts').style.display='flex';
    $('sheet').style.display='block';$('fabs').style.bottom='calc(150px + env(safe-area-inset-bottom,0px))';
    map.flyTo(dest,Math.max(map.getZoom(),16));
  }
  map.on('click',function(e){
    res.style.display='none';
    var la=e.latlng.lat,lo=e.latlng.lng;
    pick(la,lo,'Titik terpilih',la.toFixed(5)+', '+lo.toFixed(5));
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=id&lat='+la+'&lon='+lo)
      .then(function(r){return r.json()}).then(function(p){
        if(p&&p.display_name&&dest&&dest[0]===la){$('t').textContent=p.name||p.display_name.split(', ')[0];$('a').textContent=p.display_name}
      }).catch(function(){});
  });
  $('x').onclick=function(){
    if(pin){pin.remove();pin=null}dest=null;clearRoute();
    $('sheet').style.display='none';$('fabs').style.bottom='calc(16px + env(safe-area-inset-bottom,0px))';
  };

  /* Rute */
  function clearRoute(){if(line){line.remove();lineBg.remove();line=lineBg=null}}
  var API={car:'routed-car',bike:'routed-bike',foot:'routed-foot'};
  var MOD={left:'kiri',right:'kanan','slight left':'serong kiri','slight right':'serong kanan','sharp left':'tajam ke kiri','sharp right':'tajam ke kanan'};
  function km(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
  function mnt(s){var m=Math.round(s/60);return m<60?m+' mnt':Math.floor(m/60)+' j '+(m%60)+' mnt'}
  function route(){
    if(!me){toast('Aktifkan lokasi dulu untuk membuat rute');locate();return}
    $('acts').style.display='none';$('rpanel').style.display='block';
    $('sum').textContent='Menghitung rute…';$('steps').innerHTML='';
    var u='https://routing.openstreetmap.de/'+API[mode]+'/route/v1/driving/'+me[1]+','+me[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson&steps=true';
    fetch(u).then(function(r){return r.json()}).then(function(d){
      if(!d.routes||!d.routes.length){$('sum').textContent='Rute tidak ditemukan.';return}
      var r=d.routes[0],pts=r.geometry.coordinates.map(function(c){return[c[1],c[0]]});
      clearRoute();
      lineBg=L.polyline(pts,{color:'#fff',weight:10,opacity:.9}).addTo(map);
      line=L.polyline(pts,{color:'#1a73e8',weight:6}).addTo(map);
      map.fitBounds(line.getBounds(),{paddingTopLeft:[20,90],paddingBottomRight:[20,260]});
      $('sum').innerHTML=mnt(r.duration)+' <span>('+km(r.distance)+')</span>';
      var ul=$('steps');ul.innerHTML='';
      r.legs[0].steps.forEach(function(s){
        var m=s.maneuver,t;
        if(m.type==='arrive')t='Tiba di tujuan';
        else{
          var md=m.modifier;
          t=m.type==='depart'?'Mulai':md==='uturn'?'Putar balik':(!md||md==='straight')?'Lurus':'Belok '+(MOD[md]||md);
          if(s.name)t+=' di '+s.name;
        }
        var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('i');
        a.textContent=t;b.textContent=km(s.distance);li.appendChild(a);li.appendChild(b);ul.appendChild(li);
      });
    }).catch(function(){$('sum').textContent='Gagal mengambil rute. Periksa koneksi.'});
  }
  $('rt').onclick=route;
  document.querySelectorAll('#modes .btn').forEach(function(b){
    b.onclick=function(){mode=b.dataset.m;document.querySelectorAll('#modes .btn').forEach(function(o){o.setAttribute('aria-pressed',o===b)});route()};
  });

  locate();
})();
</script>
</body>
</html>
